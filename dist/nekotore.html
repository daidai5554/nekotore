<title>ねこトレ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Fredoka:wght@500;600&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
/* Layout: one phone column (max 480px). Cat stage up top, a 肉球 stamp card for the week, fixed bottom tab bar. */
:root{
  --bg:#F1F2F7; --surface:#FFFFFF; --surface-2:#E7E9F2; --ink:#24253B; --muted:#62667F; --line:#DADCE8;
  --paw:#D4426F; --on-paw:#FFFFFF; --paw-soft:#FBE3EB; --bonito:#D99A16; --ok:#2C9468; --shade:rgba(20,21,39,.45);
  --win-bg:#1C1D38; --win-fg:#FFFFFF; --win-dim:#B9BCE0; --win-acc:#FFD15C; --win-cat:#FF9FC0;
  --f-pixel:"DotGothic16","Zen Maru Gothic",monospace;
  --f-display:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic","Noto Sans JP",sans-serif;
  --f-num:"Fredoka","Zen Maru Gothic",ui-rounded,sans-serif;
  --r:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141527; --surface:#1F2138; --surface-2:#2A2D49; --ink:#ECEDF8; --muted:#A2A6C4; --line:#33365A;
  --paw:#FF86AE; --on-paw:#2A0F1C; --paw-soft:#3B2440; --bonito:#F3C14F; --ok:#52C796; --shade:rgba(0,0,0,.6); --win-bg:#0B0C1C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141527; --surface:#1F2138; --surface-2:#2A2D49; --ink:#ECEDF8; --muted:#A2A6C4; --line:#33365A;
  --paw:#FF86AE; --on-paw:#2A0F1C; --paw-soft:#3B2440; --bonito:#F3C14F; --ok:#52C796; --shade:rgba(0,0,0,.6); --win-bg:#0B0C1C; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--paw);outline-offset:2px;border-radius:8px}
h1,h2,h3{font-family:var(--f-display);line-height:1.3;margin:0;text-wrap:balance}
h1{font-size:24px;font-weight:900}
h2{font-size:18px;font-weight:700}
p{margin:0}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.eyebrow{font-size:12px;letter-spacing:.08em;color:var(--muted);font-weight:700}
.muted{color:var(--muted)}
.small{font-size:13px}

#app{max-width:480px;margin:0 auto;min-height:100%}
.screen{padding-inline:16px;padding-block:16px 112px;display:flex;flex-direction:column;gap:20px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.logo{font-family:var(--f-display);font-weight:900;font-size:20px;display:flex;align-items:center;gap:6px}
.logo svg{width:22px;height:22px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:12px}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:12px 20px;border-radius:999px;border:0;font-weight:700;font-family:var(--f-display);font-size:16px;width:100%;text-align:center}
.btn.primary{background:var(--paw);color:var(--on-paw)}
.btn.primary:active{transform:translateY(1px)}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn.soft{background:var(--paw-soft);color:var(--ink)}
.btn.sm{min-height:40px;font-size:14px;padding:8px 14px;width:auto}
.btn:disabled{opacity:.45;cursor:not-allowed}
.link{background:none;border:0;color:var(--paw);font-weight:700;padding:6px 0;text-decoration:underline;text-underline-offset:3px}

/* cat stage */
.stage{display:grid;grid-template-columns:150px 1fr;gap:12px;align-items:center}
.catbtn{background:none;border:0;padding:0;position:relative;display:block}
.cat{display:block;width:100%;height:auto;transform-origin:50% 90%;animation:bob 3.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-3px) rotate(-1deg)}}
.catbtn.petted .cat{animation:wiggle .6s ease-in-out 2}
@keyframes wiggle{25%{transform:rotate(-5deg)}75%{transform:rotate(5deg)}}
.hearts{position:absolute;inset:0;pointer-events:none}
.hearts i{position:absolute;bottom:60%;font-style:normal;color:var(--paw);font-size:20px;animation:float 1.2s ease-out forwards}
@keyframes float{from{opacity:1;transform:translateY(0) scale(.6)}to{opacity:0;transform:translateY(-60px) scale(1.2)}}
.bubble{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px 14px;min-width:0}
.bubble::before{content:"";position:absolute;left:-8px;top:50%;width:14px;height:14px;background:var(--surface);border-left:1px solid var(--line);border-bottom:1px solid var(--line);transform:translateY(-50%) rotate(45deg)}
.bubble b{font-family:var(--f-display);font-size:13px;color:var(--paw);display:block}
.bubble p{font-size:15px;font-weight:500}
.bond{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;font-size:13px}
.meter{grid-column:1/-1;height:10px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--bonito);border-radius:99px;transition:width .6s}

/* week stamp card */
.stamps h2{font-size:16px}
.rowb{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.week{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.week li{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--muted)}
.stamp{width:100%;max-width:44px;aspect-ratio:1;border-radius:50%;border:1.5px dashed var(--line);display:grid;place-items:center}
.stamp svg{width:70%;height:70%;fill:var(--paw)}
.stamp.on{border:1.5px solid var(--paw);background:var(--paw-soft)}
.stamp.on svg{transform:rotate(-12deg)}
.week li.today{color:var(--ink);font-weight:700}
.week li.today .stamp{border-color:var(--ink)}

.today h2{font-size:22px}
.exlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.exlist li{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.exlist li:last-child{border-bottom:0}
.exlist span:last-child{color:var(--muted);white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:700;background:var(--surface-2);color:var(--ink)}
.pill.ok{background:var(--ok);color:var(--surface)}
.pill.paw{background:var(--paw-soft);color:var(--ink)}
.note{font-size:12px;color:var(--muted);line-height:1.7}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:20}
.tabs nav{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tabs button{background:none;border:0;padding:8px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);font-weight:700}
.tabs svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tabs button[aria-current="page"]{color:var(--paw)}

/* onboarding */
.ob{padding-block:16px 32px}
.steps{display:flex;gap:6px}
.steps i{flex:1;height:6px;border-radius:99px;background:var(--surface-2)}
.steps i.on{background:var(--paw)}
.obcat{display:flex;justify-content:center}
.obcat .cat{width:230px;max-width:100%}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.flabel{font-size:13px;font-weight:700}
.inp{width:100%;min-height:48px;padding:10px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-size:16px}
.inp:focus{border-color:var(--paw);outline:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.unit{position:relative}
.unit .inp{padding-right:44px}
.unit span{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:8px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-weight:500;font-size:14px;display:flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{border-color:var(--paw);background:var(--paw-soft);font-weight:700}
.chip:disabled{opacity:.45}
.chip .sw{width:16px;height:16px;border-radius:50%;border:1px solid var(--line)}
.choice{display:flex;flex-direction:column;gap:8px}
.choice .chip{width:100%;justify-content:space-between;text-align:left;min-height:56px}
.choice .chip small{color:var(--muted);font-weight:400}
.check{display:flex;gap:10px;align-items:flex-start;font-size:13px;line-height:1.6}
.check input{width:22px;height:22px;accent-color:var(--paw);flex:none;margin-top:1px}
.obnav{display:grid;grid-template-columns:auto 1fr;gap:10px}
.obnav .btn.ghost{width:auto;padding-inline:22px}
.err{color:var(--paw);font-size:13px;font-weight:700}

/* plan */
.why ul{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:4px;font-size:14px}
.day{display:flex;flex-direction:column;gap:8px}
.dayhead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.dnum{font-family:var(--f-num);font-weight:600;color:var(--paw)}
.plist{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.plist>li{border-bottom:1px solid var(--line)}
.plist>li:last-child{border-bottom:0}
.prow{width:100%;background:none;border:0;padding:12px 16px;display:flex;justify-content:space-between;gap:12px;text-align:left;align-items:center}
.prow .pn{font-weight:700;min-width:0}
.prow .ps{color:var(--muted);font-size:13px;white-space:nowrap}
.howbox{padding:0 16px 14px;display:flex;flex-direction:column;gap:8px;font-size:14px}
.howbox ol{margin:0;padding-left:1.3em}
.cue{background:var(--paw-soft);border-radius:12px;padding:8px 12px;font-size:13px}
.cue b{font-family:var(--f-display)}

/* session */
.sbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);padding:10px 16px;display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}
.sbar .ttl{font-family:var(--f-display);font-weight:700;font-size:14px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{background:var(--surface);border:1px solid var(--line);border-radius:99px;min-width:44px;height:40px;padding:0 12px;font-weight:700;font-size:13px}
.prog{display:flex;gap:4px;padding-inline:16px}
.prog i{flex:1;height:6px;border-radius:99px;background:var(--surface-2)}
.prog i.done{background:var(--ok)}
.prog i.cur{background:var(--paw)}
.sess{padding-inline:16px;padding-block:14px 120px;display:flex;flex-direction:column;gap:16px}
.coach{display:grid;grid-template-columns:84px 1fr;gap:10px;align-items:center}
.ex h2{font-size:24px;font-weight:900}
.target{font-size:15px;font-weight:700}
.prev{font-size:13px;color:var(--muted)}
.sets{display:flex;flex-direction:column;gap:8px}
.set{display:grid;grid-template-columns:20px 1fr auto;gap:6px;align-items:center;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:8px 10px}
.set.done{border-color:var(--ok)}
.set .no{font-family:var(--f-num);font-weight:600;color:var(--muted);text-align:center}
.set .vals{display:flex;align-items:center;gap:4px;flex-wrap:wrap;min-width:0}
.set .vals input{width:54px;min-height:42px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);text-align:center;font-family:var(--f-num);font-size:18px;font-variant-numeric:tabular-nums}
.set .vals span{font-size:13px;color:var(--muted)}
.stepper{display:inline-flex;align-items:center;border:1.5px solid var(--line);border-radius:12px;overflow:hidden;background:var(--bg)}
.stepper input{border:0!important;border-radius:0!important;width:40px!important}
.set .vals .u{font-size:12px}
.stp{width:30px;min-height:42px;border:0;background:var(--surface-2);font-size:18px;font-weight:700;color:var(--ink)}
.set .acts{display:flex;gap:6px}
.chk{width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center}
.chk svg{width:22px;height:22px;stroke:var(--muted);fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.set.done .chk{background:var(--ok);border-color:var(--ok)}
.set.done .chk svg{stroke:var(--surface)}
.play{width:48px;height:48px;border-radius:50%;border:0;background:var(--paw-soft);display:grid;place-items:center}
.play svg{width:20px;height:20px;fill:var(--paw)}
.sfoot{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));z-index:15}
.sfoot div{max-width:448px;margin:0 auto;display:grid;grid-template-columns:auto 1fr;gap:10px}
.sfoot .btn.ghost{width:auto;padding-inline:18px}
.rowbtns{display:flex;gap:8px;flex-wrap:wrap}
.warm{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.warm li{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;justify-content:space-between;gap:10px}

/* timer */
#timer{position:fixed;inset:0;z-index:50;background:var(--shade);display:flex;align-items:flex-end;justify-content:center}
.tsheet{background:var(--surface);width:100%;max-width:480px;border-radius:28px 28px 0 0;padding:24px 16px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:14px}
.ring{position:relative;width:220px;max-width:70vw;aspect-ratio:1}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:12}
.ring .bg{stroke:var(--surface-2)}
.ring .fg{stroke:var(--paw);stroke-linecap:round;transition:stroke-dashoffset .2s linear}
.ring.work .fg{stroke:var(--ok)}
.ring .t{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-num);font-weight:600;font-size:64px;font-variant-numeric:tabular-nums}
.tlabel{font-family:var(--f-display);font-weight:700;font-size:18px}
.tsheet .rowbtns{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* result */
.res{align-items:stretch;text-align:center}
.res .cat{width:230px;max-width:100%;margin:0 auto}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 6px;display:flex;flex-direction:column;gap:2px}
.stat b{font-family:var(--f-num);font-size:24px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.2}
.stat span{font-size:11px;color:var(--muted)}
.notes{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;text-align:left}
.notes li{background:var(--paw-soft);border-radius:12px;padding:10px 12px;font-size:14px;font-weight:500}
.rpe{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rpe .chip{justify-content:center}

/* log */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .wd{font-size:11px;color:var(--muted);font-weight:700}
.cal .d{aspect-ratio:1;max-width:100%;border-radius:10px;display:grid;place-items:center;font-family:var(--f-num);font-size:13px;position:relative}
.cal .d.on{background:var(--paw-soft)}
.cal .d.on svg{position:absolute;width:62%;height:62%;fill:var(--paw);opacity:.85;transform:rotate(-12deg)}
.cal .d.on span{position:relative;font-size:10px;align-self:start;justify-self:end;padding:2px 4px;color:var(--ink)}
.cal .d.today{outline:1.5px solid var(--ink)}
.hist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.hist li{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.hist li:last-child{border-bottom:0}
.spark{width:100%;height:80px;display:block}
.spark .ln{fill:none;stroke:var(--paw);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.spark .ar{fill:var(--paw-soft)}
.spark .gd{stroke:var(--line);stroke-width:1}
.spark text{fill:var(--muted);font-size:10px;font-family:var(--f-num)}
.spark .pt{fill:var(--paw)}
.inrow{display:grid;grid-template-columns:1fr auto;gap:10px}
textarea.inp{min-height:120px;font-size:12px;font-family:ui-monospace,monospace}

/* RPG */
.lvrows{display:flex;flex-direction:column;gap:10px}
.lvrow{display:grid;grid-template-columns:auto 1fr auto;gap:4px 10px;align-items:center;background:none;border:0;padding:0;text-align:left;width:100%;font-size:13px}
.lvrow .meter{grid-column:1/-1;height:8px}
.lvrow.cat .meter i{background:var(--paw)}
.lvrow .lvname{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lvtag{font-family:var(--f-pixel);background:var(--win-bg);color:var(--win-fg);padding:2px 8px;border-radius:4px;font-size:13px}
.rpg{background:var(--win-bg);color:var(--win-fg);border:3px solid var(--win-fg);box-shadow:0 0 0 4px var(--win-bg);border-radius:10px;margin:4px;padding:14px 16px;font-family:var(--f-pixel);display:flex;flex-direction:column;gap:8px;text-align:left;font-size:15px;line-height:1.6}
.rpg .dim{color:var(--win-dim)}
.rpg .big{font-size:20px}
.rpg hr{border:0;border-top:2px dashed var(--win-dim);opacity:.5;margin:4px 0;width:100%}
.rpg .bar{height:10px;background:rgba(255,255,255,.16);border-radius:2px;overflow:hidden}
.rpg .bar i{display:block;height:100%;background:var(--win-acc)}
.rpg.catwin .bar i{background:var(--win-cat)}
.srow{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:baseline}
.srow small{color:var(--win-dim);margin-left:6px;font-size:12px}
.srow .bar{grid-column:1/-1}
.catwin .cwrap{display:grid;grid-template-columns:96px 1fr;gap:12px;align-items:center}
.explines{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.explines li{display:flex;justify-content:space-between;gap:12px;color:var(--win-dim)}
.explines li span:last-child{color:var(--win-fg)}
.rpg .lvup{color:var(--win-acc);font-size:18px}
.rpg .ln{animation:pop .35s both}
@keyframes pop{from{opacity:0;transform:translateY(4px)}}
.ach{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ach li{border:1.5px dashed var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.ach li b{font-family:var(--f-display);font-size:14px}
.ach li span{font-size:12px;color:var(--muted)}
.ach li.on{border:1.5px solid var(--bonito);background:var(--surface)}
.ach li.on b::before{content:"★ ";color:var(--bonito)}

/* battle / gear */
.battle{display:flex;flex-direction:column;gap:8px}
.bfield{display:grid;grid-template-columns:1fr 104px;align-items:end;gap:8px;background:var(--surface);border:1px solid var(--line);border-bottom:5px solid var(--line);border-radius:var(--r);padding:12px 12px 0}
.mon{position:relative;justify-self:center;width:128px;max-width:100%}
.mon.boss{width:150px}
.mon svg{width:100%;height:auto;display:block;animation:bob 2.4s ease-in-out infinite}
.mon.hit svg{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.mon.down svg{opacity:.25;filter:grayscale(1);transform:rotate(80deg) translate(16px,6px);animation:none}
.dmg{position:absolute;left:50%;top:10%;font-family:var(--f-pixel);font-size:30px;color:var(--paw);animation:dmg .9s ease-out forwards;pointer-events:none}
@keyframes dmg{from{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,-32px)}}
.watcher{display:flex;flex-direction:column;align-items:center;font-size:11px;color:var(--muted);padding-bottom:6px;gap:2px}
.watcher .cat{animation:none}

.drep{margin-left:auto;font-weight:700;font-size:16px}
.dpts{margin:0;padding-left:1.3em;font-size:14px;display:flex;flex-direction:column;gap:2px}

.vb{position:relative;height:12px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.vb i{position:absolute;left:0;top:0;bottom:0;background:var(--paw);border-radius:99px;opacity:.85}

const bmi = p => p.weight / ((p.height / 100) ** 2);
const bmiLabel = b => b < 18.5 ? 'やせ' : b < 25 ? '標準' : b < 30 ? '肥満（1度）' : '肥満（2度以上）';
const lvIdx = p => ({ beginner: 0, intermediate: 1, advanced: 2 })[p.level];
const allowImpact = p => !(p.limits.includes('knee') || bmi(p) >= 28 || p.age >= 60);
const canUse = (e, p) => (e.req || []).every(g => g.some(q => p.equipment.includes(q))) && !(e.avoid || []).some(a => p.limits.includes(a)) && (allowImpact(p) || !e.impact);

function candidates(slot, p, used) {
  const grp = GROUPS[slot] || [slot];
  const maxLv = lvIdx(p) + 1;
  const ok = e => grp.includes(e.p) && canUse(e, p) && !used.has(e.id);
  let list = EX.filter(e => ok(e) && e.lv <= maxLv);
  // 条件に合う種目がないときだけ1段階上まで広げる（初心者に上級種目は出さない）
  if (!list.length) list = EX.filter(e => ok(e) && e.lv <= Math.min(maxLv + 1, p.level === 'beginner' ? 2 : 3));
  const score = e => -grp.indexOf(e.p) * 2 - Math.abs(e.lv - maxLv) * .8 + (e.w ? 1 : 0) + (e.pri || 0)
    + (p.goal === 'muscle' ? (e.w ? .8 : 0) - (e.impact ? .8 : 0) - (e.unit === 'sec' && e.p !== 'core' ? .6 : 0) : 0);
  return list.map(e => ({ e, s: score(e) })).sort((a, b) => b.s - a.s);
}

// 体重の変化ペース：直近4週間の記録から1週間あたりの変化を求める（最小二乗法）
function weightTrend() {
  const W = S.weights.filter(w => Date.now() - new Date(w.d).getTime() < 28 * 864e5);
  if (W.length < 3) return '';
  const xs = W.map(w => new Date(w.d).getTime() / 864e5), span = Math.max(...xs) - Math.min(...xs); if (span < 7) return '';
  const mx = xs.reduce((a, b) => a + b) / xs.length, my = W.reduce((a, w) => a + w.kg, 0) / W.length;
  const slope = xs.reduce((a, x, i) => a + (x - mx) * (W[i].kg - my), 0) / xs.reduce((a, x) => a + (x - mx) ** 2, 0) * 7;
  const cur = W[W.length - 1].kg, pct = slope / cur * 100, sign = v => (v > 0 ? '+' : '') + v.toFixed(Math.abs(v) < 1 ? 2 : 1);
  let msg = `直近の変化：1週間あたり <b class="num">${sign(slope)}kg</b>（体重の${sign(pct)}%）。`;
  const g = S.profile.goal;
  // 減量は週に体重の0.5〜1%、増量（筋肉をつける）は0.25〜0.5%が目安
  if (g === 'diet') msg += pct < -1 ? '減るペースが速めです。筋肉が落ちやすいので、食事を少し増やしましょう（目安は体重の0.5〜1%/週）。' : pct <= -.5 ? 'ちょうどよいペースです。' : '目安は1週間に体重の0.5〜1%減です。';
  else if (g === 'muscle') msg += pct > .5 ? '増えるペースが速めです。脂肪がつきやすいので、食事を少し控えめに（目安は0.25〜0.5%/週）。' : pct >= .25 ? '筋肉をつけるのにちょうどよいペースです。' : '筋肉をつけるには、1週間に体重の0.25〜0.5%増が目安です。';
  return msg;
}

  const bar = `<div class="sbar"><button class="iconbtn" data-act="quit">終了</button><div class="ttl">${esc(s.label)}</div><span class="iconbtn num" id="elapsed" style="display:grid;place-items:center">0:00</span></div>
    <div class="prog">${s.items.map((it, i) => `<i class="${i === s.cur ? 'cur' : it.log.every(l => l.done) ? 'done' : ''}"></i>`).join('')}</div>`;
  const coach = s.battle ? battleHTML(s) : `<div class="coach">${myCat(s.cur < 0 ? 'normal' : p.cat.per === 'hot' ? 'fire' : 'normal')}<div class="bubble"><b>${esc(p.cat.name)}</b><p>${sessMsg || say('start')}</p></div></div>`;
  if (s.cur < 0) {
    return `${bar}<main class="sess">${coach}

      <ul class="warm">${warmupFor(S.program.days[s.di] ? S.program.days[s.di].type : 'full').map(w => `<li><span>${w[0]}</span><span class="muted num">${w[1]}</span></li>`).join('')}</ul>
      <p class="note">体があたたまるとケガをしにくく、力も出やすくなります。</p></main>
      <div class="sfoot"><div><button class="btn ghost" data-act="go" data-v="0">スキップ</button><button class="btn primary" data-act="go" data-v="0">準備できた</button></div></div>`;
  }
  const it = s.items[s.cur], e = EXM[it.id], last = lastLog(it.id);
  const amt = it.secT ? `${it.secT}秒` : `${it.loT}〜${it.hiT}回`;
  const allDone = it.log.every(l => l.done);
  const rows = it.log.map((l, j) => `<div class="set ${l.done ? 'done' : ''}"><span class="no">${j + 1}</span>
    <div class="vals">${e.w ? `<input type="number" inputmode="decimal" step="0.5" min="0" id="w-${s.cur}-${j}" data-log="${j}-w" value="${esc(l.w)}" aria-label="${j + 1}セット目の重さ"><span>kg ×</span>` : ''}
    <span class="stepper"><button class="stp" data-act="step" data-v="${j}|-1" aria-label="${j + 1}セット目を減らす">−</button><input type="number" inputmode="numeric" min="0" id="r-${s.cur}-${j}" data-log="${j}-r" value="${esc(l.r)}" aria-label="${j + 1}セット目の${it.secT ? '秒数' : '回数'}"><button class="stp" data-act="step" data-v="${j}|1" aria-label="${j + 1}セット目を増やす">＋</button></span><span class="u">${it.secT ? '秒' : '回'}</span></div>
    <div class="acts">${it.secT && !l.done ? `<button class="play" data-act="work" data-v="${j}" aria-label="タイマー開始">${PLAY}</button>` : ''}<button class="chk" data-act="done" data-v="${j}" aria-label="${j + 1}セット目を完了">${CHECK}</button></div></div>`).join('');
  const isLast = s.cur === n - 1;
  return `${bar}<main class="sess">${coach}
    <section class="ex" style="display:flex;flex-direction:column;gap:6px">
      <div class="eyebrow">${s.cur + 1} / ${n} · ${PL[e.p]}</div>
      <h2>${e.n}</h2>
      <p class="target">${it.sets}セット × ${amt}${e.side ? '（左右それぞれ）' : ''} · 休憩${it.rest}秒</p>
      ${last ? `<p class="prev">前回：${last}</p>` : ''}
      ${it.guess ? `<p class="prev">重さは体重などから出した目安（${it.guess}kg）です。${it.hiT}回が楽にできたら重く、${it.loT}回できなければ軽くしてください。</p>` : ''}
    </section>
    ${demoHTML(e, it)}
    <details class="card" style="gap:8px"><summary style="font-weight:700;cursor:pointer">手順とコツを読む</summary><div class="howbox" style="padding:8px 0 0">${howHTML(e)}</div></details>
    <div class="sets">${rows}</div>
    <p class="note">${it.secT ? '▶でカウントダウン開始。' : '「いっしょにやる」でお手本のリズムに合わせて動けます。できた回数に書きかえてから✓を押してください。'}全セットで目標の上限に届くと、次回の目標が上がります。</p>
    <div class="rowbtns"><button class="btn ghost sm" data-act="swapSess">別の種目に替える</button></div>
  </main>
  <div class="sfoot"><div><button class="btn ghost" data-act="go" data-v="${Math.max(0, s.cur - 1)}" ${s.cur === 0 ? 'disabled' : ''}>戻る</button>${isLast
      ? '<button class="btn primary" data-act="finish">トレーニング完了</button>'
      : `<button class="btn primary" data-act="go" data-v="${s.cur + 1}">${allDone ? '次の種目へ' : 'とばして次へ'}</button>`}</div></div>`;
}
function lastLog(id) {
  for (let i = S.history.length - 1; i >= 0; i--) {
    const x = S.history[i].items.find(y => y.id === id);
    if (x) { const e = EXM[id], w = Math.max(...x.sets.map(s => s.w || 0)); return x.sets.map(s => s.r).join('・') + (EXM[id].unit === 'sec' ? '秒' : '回') + (e.w && w ? ` ＠ ${w}kg` : ''); }
  }
  return '';
}

function vResult() {
  const r = S.lastResult, h = S.history[r.idx], p = S.profile;
  const m = Math.max(1, Math.round(h.dur / 60));
  const reps = h.items.reduce((a, it) => a + it.sets.reduce((b, s) => b + (EXM[it.id].unit === 'sec' ? 0 : s.r), 0), 0);
  return `<main class="screen res">
    <div class="eyebrow">${esc(h.label)}</div>
    ${myCat('happy')}
    <div class="bubble" style="text-align:left"><b>${esc(p.cat.name)}</b><p>${rpeMsg || r.msg}</p></div>
    <div class="stats"><div class="stat"><b>${m}</b><span>分</span></div><div class="stat"><b>${h.kcal}</b><span>kcal（目安）</span></div><div class="stat"><b>${h.vol > 0 ? Math.round(h.vol) : reps}</b><span>${h.vol > 0 ? '総挙上量 kg' : '合計回数'}</span></div></div>
    ${rpgWin(r)}
    <p class="small"><b>${esc(p.cat.name)}のなかよし度 +${r.xp}</b>${r.up ? ` · <span class="pill paw">Lv.${bondLv(S.xp)}「${BOND[bondLv(S.xp) - 1][1]}」になった！</span>` : ''}${r.unlock ? `<br>なかよしのしるしに「${r.unlock}」をもらいました（ステータス → そうび）` : ''}</p>
    ${r.notes.length ? `<section style="display:flex;flex-direction:column;gap:8px;text-align:left"><h2>次回に向けて</h2><ul class="notes">${r.notes.map(n => `<li>${esc(n)}</li>`).join('')}</ul></section>` : ''}
    <section class="card" style="text-align:left"><h2>今日のきつさは？</h2><p class="muted small">次回の量の調整に使います。</p>
      <div class="rpe">${[['hard', 'きつかった'], ['ok', 'ちょうどいい'], ['easy', '余裕']].map(([k, l]) => `<button class="chip" data-act="rpe" data-v="${k}" aria-pressed="${h.rpe === k}">${l}</button>`).join('')}</div></section>
    <button class="btn primary" data-act="tab" data-v="home">ホームへ</button>
  </main>`;
}

function rpgWin(r) {
  const g = r.rpg; if (!g) return '';
  let d = 0; const D = () => `style="animation-delay:${(d++ * .18).toFixed(2)}s"`;
  const cat = esc(S.profile.cat.name);
  return `<section class="rpg">
    ${g.mon ? (g.won ? `<p class="ln" ${D()}>${g.mon}を たおした！</p>` : `<p class="ln dim" ${D()}>${g.mon}は にげていった…</p>`) : ''}
    ${g.drop ? `<p class="ln lvup" ${D()}>${g.mon}は ${GEARM[g.drop].n}（${'★'.repeat(GEARM[g.drop].r)}）を おとした！<br>${cat}が ひろった。</p>` : ''}
    <p class="ln" ${D()}>${pname()}は けいけんち ${g.gain} を かくとく！</p>
    <ul class="explines">${g.lines.map(l => `<li class="ln" ${D()}><span>${l[0]}</span><span>+${l[1]}</span></li>`).join('')}</ul>
    ${g.L1 > g.L0 ? `<p class="ln lvup" ${D()}>${pname()}は レベル ${g.L1} に あがった！</p>` : ''}
    ${g.title ? `<p class="ln" ${D()}>称号「${g.title}」を 手に入れた！</p>` : ''}
    ${g.ups.map(u => `<p class="ln" ${D()}>${u[0]}が ${u[2] - u[1]} あがった！</p>`).join('')}
    ${g.ach.map(a => `<p class="ln" ${D()}>実績「${a}」を 達成した！</p>`).join('')}
    <div class="bar ln" ${D()}><i style="width:${g.pct}%"></i></div>
    <p class="dim small">Lv ${g.L1} · つぎのレベルまで ${g.left}</p>
  </section>${g.drop && S.equip[GEARM[g.drop].slot] !== g.drop ? `<button class="btn soft" data-act="equip" data-v="${g.drop}">${GEARM[g.drop].n}を ${cat}に そうびさせる</button>` : ''}`;
}
function vLog() {
  const p = S.profile, base = new Date(); base.setDate(1); base.setMonth(base.getMonth() + calOff);
  const y = base.getFullYear(), mo = base.getMonth(), first = (new Date(y, mo, 1).getDay() + 6) % 7, nd = new Date(y, mo + 1, 0).getDate();
  const cnt = {}; S.history.forEach(h => { const k = ymd(h.ts); cnt[k] = (cnt[k] || 0) + 1; });
  const today = ymd(Date.now());
  let cal = ['月', '火', '水', '木', '金', '土', '日'].map(w => `<span class="wd">${w}</span>`).join('') + '<span></span>'.repeat(first);
  for (let d = 1; d <= nd; d++) { const k = `${y}-${pad(mo + 1)}-${pad(d)}`; cal += `<span class="d ${cnt[k] ? 'on' : ''} ${k === today ? 'today' : ''}">${cnt[k] ? PAW + `<span>${d}</span>` : d}</span>`; }
  const monthN = S.history.filter(h => { const d = new Date(h.ts); return d.getFullYear() === y && d.getMonth() === mo; }).length;
  const totalMin = Math.round(S.history.reduce((a, h) => a + h.dur, 0) / 60);
  const recent = S.history.slice(-8).reverse();
  return `<main class="screen">
    <header><h1>記録</h1></header>
    <div class="stats"><div class="stat"><b>${S.history.length}</b><span>合計回数</span></div><div class="stat"><b>${totalMin}</b><span>合計 分</span></div><div class="stat"><b>${streak()}</b><span>週連続達成</span></div></div>
    <section class="card">
      <div class="rowb"><button class="iconbtn" data-act="cal" data-v="-1" aria-label="前の月">‹</button><h2>${y}年${mo + 1}月 <span class="small muted">${monthN}回</span></h2><button class="iconbtn" data-act="cal" data-v="1" aria-label="次の月" ${calOff >= 0 ? 'disabled' : ''}>›</button></div>
      <div class="cal">${cal}</div>
    </section>
    <section class="card">
      <h2>体重</h2>
      ${sparkline()}
      ${weightTrend() ? `<p class="small">${weightTrend()}</p>` : ''}
      <div class="inrow"><div class="unit"><input class="inp" type="number" inputmode="decimal" step="0.1" id="wIn" placeholder="${p.weight}" aria-label="今日の体重"><span>kg</span></div><button class="btn primary sm" data-act="logW">記録する</button></div>
      <p class="note">記録した体重は消費カロリーの目安にも使います。</p>
    </section>
    <section class="card"><h2>最近のトレーニング</h2>
      ${recent.length ? `<ul class="hist">${recent.map(h => { const d = new Date(h.ts); return `<li><span><span class="num">${d.getMonth() + 1}/${d.getDate()}</span>（${WD[d.getDay()]}） ${esc(h.label)}</span><span class="muted num">${Math.max(1, Math.round(h.dur / 60))}分</span></li>`; }).join('')}</ul>` : '<p class="muted small">まだ記録がありません。最初の1回で肉球スタンプが押されます。</p>'}
    </section>
  </main>`;
}
function sparkline() {
  const W = S.weights.slice(-30);
  if (W.length < 2) return `<p class="muted small">${W.length ? `${W[0].d.slice(5).replace('-', '/')}：<b class="num">${W[0].kg}</b>kg。2回以上記録するとグラフになります。` : '毎週同じ時間帯に測るのがおすすめです。'}</p>`;
  const vs = W.map(w => w.kg), mn = Math.min(...vs) - .5, mx = Math.max(...vs) + .5, w = 300, h = 80, l = 30, r = 8, t = 8, b = 16;
  const X = i => l + i * (w - l - r) / (W.length - 1), Y = v => t + (mx - v) * (h - t - b) / (mx - mn);
  const pts = W.map((x, i) => `${X(i).toFixed(1)},${Y(x.kg).toFixed(1)}`).join(' ');
  const lastI = W.length - 1;
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" role="img" aria-label="体重の推移">
    <line class="gd" x1="${l}" x2="${w - r}" y1="${Y(mx - .5)}" y2="${Y(mx - .5)}"/><line class="gd" x1="${l}" x2="${w - r}" y1="${Y(mn + .5)}" y2="${Y(mn + .5)}"/>
    <text x="0" y="${Y(mx - .5) + 3}">${(mx - .5).toFixed(1)}</text><text x="0" y="${Y(mn + .5) + 3}">${(mn + .5).toFixed(1)}</text>
    <polygon class="ar" points="${X(0)},${h - b} ${pts} ${X(lastI)},${h - b}"/><polyline class="ln" points="${pts}"/>
    <circle class="pt" cx="${X(lastI)}" cy="${Y(W[lastI].kg)}" r="4"/>
    <text x="${l}" y="${h - 2}">${W[0].d.slice(5).replace('-', '/')}</text><text x="${w - r}" y="${h - 2}" text-anchor="end">${W[lastI].d.slice(5).replace('-', '/')}</text>
  </svg>`;
}

      <textarea class="inp" id="backup" placeholder="ここに貼りつけて「読み込む」">${esc(backupText)}</textarea>
      <div class="grid2"><button class="btn ghost sm" style="width:100%" data-act="exportData">データをコピー</button><button class="btn ghost sm" style="width:100%" data-act="importData">読み込む</button></div>

      <button class="link" data-act="reset">すべてのデータを消す</button>

function vOnboard() {
  const d = draft, N = 5;
  const chip = (k, v, l, sub) => `<button class="chip" data-act="dchip" data-k="${k}" data-v="${v}" aria-pressed="${d[k] === v}">${l}${sub ? `<small>${sub}</small>` : ''}</button>`;
  const mchip = (k, v, l) => `<button class="chip" data-act="dmulti" data-k="${k}" data-v="${v}" aria-pressed="${d[k].includes(v)}">${l}</button>`;
  const num = (k, l, u, mn, mx, st = 1) => `<div class="field"><label for="d-${k}">${l}</label><div class="unit"><input class="inp" type="number" inputmode="decimal" id="d-${k}" data-dk="${k}" value="${esc(d[k])}" min="${mn}" max="${mx}" step="${st}"><span>${u}</span></div></div>`;
  let body = '';
  if (step === 0) {
    body = `<div class="obcat">${catSVG({ mood: d.cat.per === 'hot' ? 'fire' : 'happy' })}</div>
      <div class="bubble"><b>${esc(d.cat.name || 'トレーナー')}</b><p>${{ gentle: 'はじめましてにゃ。きみ専属のトレーナーになるにゃ。家にある道具で、続けられるメニューをいっしょに作ろうにゃ。', tsundere: 'べ、別にきみのために来たんじゃないにゃ。…でもトレーナーくらいはしてやるにゃ。', hot: 'はじめましてにゃ！きみの筋肉、ぼくが全力で応援するにゃ！' }[d.cat.per]}</p></div>
      <div class="field"><span class="flabel">性格</span><div class="chips">${Object.entries(PERS).map(([k, l]) => `<button class="chip" data-act="dcat" data-k="per" data-v="${k}" aria-pressed="${d.cat.per === k}">${l}</button>`).join('')}</div></div>
      <div class="field"><label for="d-catname">猫の名前</label><input class="inp" id="d-catname" data-dk="cat.name" value="${esc(d.cat.name)}" maxlength="10"></div>`;
  } else if (step === 1) {
    body = `<h1>あなたのことを教えてにゃ</h1>
      <div class="field"><label for="d-name">ニックネーム</label><input class="inp" id="d-name" data-dk="name" value="${esc(d.name)}" maxlength="12" placeholder="猫が呼ぶ名前"></div>
      <div class="field"><span class="flabel">性別</span><div class="chips">${SEXES.map(([v, l]) => chip('sex', v, l)).join('')}</div></div>
      <div class="grid3">${num('age', '年齢', '歳', 12, 100)}${num('height', '身長', 'cm', 120, 220, .1)}${num('weight', '体重', 'kg', 30, 200, .1)}</div>
      ${d.height && d.weight ? `<p class="muted small">BMI <b class="num">${bmi(d).toFixed(1)}</b>（${bmiLabel(bmi(d))}）</p>` : ''}`;
  } else if (step === 2) {
    body = `<h1>目標と経験は？</h1>
      <div class="field"><span class="flabel">いちばんの目標</span><div class="choice">${GOALS.map(([v, l, s]) => chip('goal', v, l, s)).join('')}</div></div>
      <div class="field"><span class="flabel">筋トレの経験</span><div class="choice">${LEVELS.map(([v, l, s]) => chip('level', v, l, s)).join('')}</div></div>`;
  } else if (step === 3) {
    body = `<h1>家にある道具は？</h1><p class="muted">あてはまるものを全部選んでください。何もなくても自重だけのメニューを作れます。</p>
      <div class="chips">${EQUIP.map(([v, l]) => mchip('equipment', v, l)).join('')}</div>`;
  } else if (step === 4) {
    body = `<h1>続けやすいペースは？</h1>
      <div class="field"><span class="flabel">1週間に何回？</span><div class="chips">${[2, 3, 4, 5, 6].map(v => chip('days', v, `週${v}回`)).join('')}</div></div>
      <div class="field"><span class="flabel">1回の時間</span><div class="chips">${[10, 20, 30, 45, 60].map(v => chip('minutes', v, `${v}分`)).join('')}</div></div>
      <div class="field"><span class="flabel">痛みや不安がある部位（任意）</span><div class="chips">${LIMITS.map(([v, l]) => mchip('limits', v, l)).join('')}</div></div>
      <label class="check"><input type="checkbox" id="d-agree" data-dk="agree" ${d.agree ? 'checked' : ''}><span>持病・治療中・妊娠中の場合は医師に相談したうえで使います。運動中に痛みや体調の変化があればすぐ中止します。</span></label>
      <p class="muted small">はじめは「少し物足りない」くらいがちょうどいいです。週${d.days}回が続いたら増やしましょう。</p>`;
  }
  return `<main class="screen ob">
    <div class="steps">${[...Array(N)].map((_, i) => `<i class="${i <= step ? 'on' : ''}"></i>`).join('')}</div>
    ${body}
    ${obErr ? `<p class="err">${obErr}</p>` : ''}
    <div class="obnav">${step > 0 ? '<button class="btn ghost" data-act="obBack">戻る</button>' : (editing ? '<button class="btn ghost" data-act="obCancel">やめる</button>' : '<span></span>')}
      <button class="btn primary" data-act="obNext">${step === N - 1 ? 'メニューを作る' : '次へ'}</button></div>
  </main>`;
}

/* ========= render ========= */
function render() {
  const app = $('#app');
  let h;
  if (!S.profile || view === 'onboard') { if (!draft) newDraft(); h = vOnboard(); }
  else if (view === 'session' && S.session) h = vSession();

function lastSets(id) { for (let i = S.history.length - 1; i >= 0; i--) { const x = S.history[i].items.find(y => y.id === id); if (x) return x.sets.map(s => s.r); } return []; }
function sessItem(it, mini) {
  const e = EXM[it.id], pr = S.prog[it.id] || {};
  const sets = mini ? 2 : clamp(it.sets + S.volAdj, 1, 5);
  const loT = it.lo != null ? it.lo + (pr.extra || 0) : null, hiT = it.hi != null ? it.hi + (pr.extra || 0) : null;
  const secT = it.sec ? it.sec + (pr.sec || 0) : null;
  const guess = e.w && pr.w == null ? startW(e, S.profile, (loT + hiT) / 2) : '';
  // 回数の初期値は「前回のそのセットの回数（なければ目標の下限）」。押すだけで実際以上の記録にならないようにする
  const prev = lastSets(it.id);

function startSession(mini) {

function finishSession() {

    if (step === 4 && !draft.agree) obErr = '確認事項にチェックを入れてください';
    if (obErr) { render(); return; }
    if (step < 4) { step++; render(); window.scrollTo(0, 0); return; }
    const p = deep(draft); delete p.agree; p.name = p.name.trim(); p.cat.name = p.cat.name.trim();
    const first = !S.profile;
    S.profile = p; S.program = buildProgram(p); S.rot = 0; S.volAdj = 0;
    if (first) S.weights = [{ d: ymd(Date.now()), kg: p.weight }];
    save(); draft = null; editing = false; step = 0;
    toast(first ? 'メニューができました' : 'メニューを作り直しました');
    go(first ? 'home' : 'plan');
  }
};
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if (!t || t.disabled) return;
  const f = A[t.dataset.act];
  if (f) { unlockAudio(); f(t, e); }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.dk && draft) {
    const k = t.dataset.dk;
    if (k === 'cat.name') draft.cat.name = t.value;
    else if (k === 'agree') draft.agree = t.checked;
    else if (['age', 'height', 'weight'].includes(k)) draft[k] = t.value === '' ? '' : +t.value;
    else draft[k] = t.value;
  } else if (t.dataset.log && S.session) {
    const [j, f] = t.dataset.log.split('-'); S.session.items[S.session.cur].log[+j][f] = t.value; save();
  } else if (t.dataset.cat && S.profile) {
    S.profile.cat.name = t.value.slice(0, 10) || 'にゃんだ'; save();
  }
});

render();
</script>
